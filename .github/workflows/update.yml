name: update
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Check for new release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/hiddify/hiddify-app/releases/latest --jq .tag_name | sed 's/^v//')
          current=$(sed -nE 's/^ *version = "([^"]+)".*/\1/p' hiddify.nix | head -1)
          echo "current=$current latest=$latest"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="https://github.com/hiddify/hiddify-app/releases/download/v${latest}/Hiddify-Linux-x64-AppImage.AppImage"
          hash=$(nix store prefetch-file --json "$url" | jq -r .hash)
          sed -i -E \
            -e "s|^( *version = )\"[^\"]+\"|\1\"${latest}\"|" \
            -e "s|^( *hash = )\"sha256-[^\"]+\"|\1\"${hash}\"|" \
            hiddify.nix
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Build (catches layout changes in the AppImage)
        if: steps.bump.outputs.changed == 'true'
        run: nix build .#hiddify --print-build-logs

      - name: Open PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "hiddify: update to ${{ steps.bump.outputs.version }}"
          commit-message: "hiddify: update to ${{ steps.bump.outputs.version }}"
          branch: update-hiddify
          delete-branch: true
